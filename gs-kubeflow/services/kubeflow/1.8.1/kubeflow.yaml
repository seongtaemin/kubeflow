---
apiVersion: source.toolkit.fluxcd.io/v1beta1
kind: GitRepository
metadata:
  name: kubeflow-instance
  namespace: ${releaseNamespace}
spec:
  interval: 1m0s
  ref:
    branch: main
  timeout: 15m0s
  url: ${gitea_url}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: kubeflow-instance
  namespace: ${releaseNamespace}
spec:
  wait: true
  retryInterval: 5m
  images:
  # ===== Cert-Manager =====
  - name: quay.io/jetstack/cert-manager-controller
    newName: ${harbor_url}/cert-manager-controller
    newTag: v1.19.4
  - name: quay.io/jetstack/cert-manager-cainjector
    newName: ${harbor_url}/cert-manager-cainjector
    newTag: v1.19.4
  - name: quay.io/jetstack/cert-manager-webhook
    newName: ${harbor_url}/cert-manager-webhook
    newTag: v1.19.4
  # ===== Istio =====
  - name: gcr.io/istio-release/pilot
    newName: ${harbor_url}/pilot
    newTag: 1.28.0
  - name: gcr.io/istio-release/proxyv2
    newName: ${harbor_url}/proxyv2
    newTag: 1.28.0
  - name: gcr.io/istio-release/install-cni
    newName: ${harbor_url}/install-cni
    newTag: 1.28.0
  - name: gcr.io/istio-release/ztunnel
    newName: ${harbor_url}/ztunnel
    newTag: 1.28.0
  # ===== Dex / OAuth2-Proxy =====
  - name: ghcr.io/dexidp/dex
    newName: ${harbor_url}/dex
    newTag: v2.45.0
  - name: quay.io/oauth2-proxy/oauth2-proxy
    newName: ${harbor_url}/oauth2-proxy
    newTag: v7.14.3
  # ===== Kubeflow Core =====
  - name: ghcr.io/kubeflow/kubeflow/central-dashboard
    newName: ${harbor_url}/central-dashboard
    newTag: v1.10.0
  - name: ghcr.io/kubeflow/kubeflow/jupyter-web-app
    newName: ${harbor_url}/jupyter-web-app
    newTag: v1.10.0
  - name: ghcr.io/kubeflow/kubeflow/notebook-controller
    newName: ${harbor_url}/notebook-controller
    newTag: v1.10.0
  - name: ghcr.io/kubeflow/kubeflow/profile-controller
    newName: ${harbor_url}/profile-controller
    newTag: v1.10.0
  - name: ghcr.io/kubeflow/kubeflow/kfam
    newName: ${harbor_url}/kfam
    newTag: v1.10.0
  - name: ghcr.io/kubeflow/kubeflow/poddefaults-webhook
    newName: ${harbor_url}/poddefaults-webhook
    newTag: v1.10.0
  - name: ghcr.io/kubeflow/kubeflow/volumes-web-app
    newName: ${harbor_url}/volumes-web-app
    newTag: v1.10.0
  - name: ghcr.io/kubeflow/kubeflow/pvcviewer-controller
    newName: ${harbor_url}/pvcviewer-controller
    newTag: v1.10.0
  - name: ghcr.io/kubeflow/kubeflow/tensorboard-controller
    newName: ${harbor_url}/tensorboard-controller
    newTag: v1.10.0
  - name: ghcr.io/kubeflow/kubeflow/tensorboards-web-app
    newName: ${harbor_url}/tensorboards-web-app
    newTag: v1.10.0
  # ===== KFP (Kubeflow Pipelines) =====
  - name: gcr.io/ml-pipeline/api-server
    newName: ${harbor_url}/kfp-backend
    newTag: 2.0.3
  - name: gcr.io/ml-pipeline/frontend
    newName: ${harbor_url}/kfp-frontend
    newTag: 2.0.3
  - name: gcr.io/ml-pipeline/metadata-writer
    newName: ${harbor_url}/kfp-metadata-writer
    newTag: 2.0.3
  - name: ghcr.io/kubeflow/kfp-api-server
    newName: ${harbor_url}/kfp-api-server
  - name: ghcr.io/kubeflow/kfp-frontend
    newName: ${harbor_url}/kfp-frontend
  - name: ghcr.io/kubeflow/kfp-persistence-agent
    newName: ${harbor_url}/kfp-persistence-agent
  - name: ghcr.io/kubeflow/kfp-scheduled-workflow-controller
    newName: ${harbor_url}/kfp-scheduled-workflow-controller
  - name: ghcr.io/kubeflow/kfp-cache-server
    newName: ${harbor_url}/kfp-cache-server
  - name: ghcr.io/kubeflow/kfp-cache-deployer
    newName: ${harbor_url}/kfp-cache-deployer
  - name: ghcr.io/kubeflow/kfp-metadata-envoy
    newName: ${harbor_url}/kfp-metadata-envoy
  - name: ghcr.io/kubeflow/kfp-metadata-writer
    newName: ${harbor_url}/kfp-metadata-writer
  - name: ghcr.io/kubeflow/kfp-viewer-crd-controller
    newName: ${harbor_url}/kfp-viewer-crd-controller
  - name: ghcr.io/kubeflow/kfp-visualization-server
    newName: ${harbor_url}/kfp-visualization-server
  - name: ghcr.io/kubeflow/kfp-inverse-proxy-agent
    newName: ${harbor_url}/kfp-inverse-proxy-agent
  - name: gcr.io/tfx-oss-public/ml_metadata_store_server
    newName: ${harbor_url}/ml_metadata_store_server
    newTag: 1.14.0
  - name: gcr.io/ml-pipeline/application-crd-controller
    newName: ${harbor_url}/application-crd-controller
    newTag: "20231101"
  - name: quay.io/argoproj/workflow-controller
    newName: ${harbor_url}/workflow-controller
    newTag: v3.7.3
  - name: chrislusf/seaweedfs
    newName: ${harbor_url}/seaweedfs
    newTag: "4.00"
  # ===== Katib =====
  - name: ghcr.io/kubeflow/katib/katib-controller
    newName: ${harbor_url}/katib-controller
    newTag: v0.19.0
  - name: ghcr.io/kubeflow/katib/katib-db-manager
    newName: ${harbor_url}/katib-db-manager
    newTag: v0.19.0
  - name: ghcr.io/kubeflow/katib/katib-ui
    newName: ${harbor_url}/katib-ui
    newTag: v0.19.0
  # ===== KServe =====
  - name: kserve/kserve-controller
    newName: ${harbor_url}/kserve-controller
    newTag: v0.16.0
  - name: ghcr.io/kserve/models-web-app
    newName: ${harbor_url}/models-web-app
    newTag: "0.16.0"
  - name: kserve/storage-initializer
    newName: ${harbor_url}/kserve-storage-initializer
    newTag: v0.16.0
  # ===== Training / Trainer =====
  - name: ghcr.io/kubeflow/training-v1/training-operator
    newName: ${harbor_url}/training-operator
    newTag: v2.1.0
  - name: ghcr.io/kubeflow/trainer/trainer-controller-manager
    newName: ${harbor_url}/trainer-controller-manager
    newTag: v1-3f15cb8
  # ===== Spark =====
  - name: ghcr.io/kubeflow/spark-operator/controller
    newName: ${harbor_url}/spark-operator-controller
    newTag: 2.5.0-rc.0
  # ===== Utilities =====
  - name: ghcr.io/containerd/busybox
    newName: ${harbor_url}/busybox
  - name: docker.io/bitnamisecure/kubectl
    newName: ${harbor_url}/kubectl
  - name: ghcr.io/metacontroller/metacontroller
    newName: ${harbor_url}/metacontroller
    newTag: v4.11.22
  - name: mysql
    newName: ${harbor_url}/mysql
    newTag: "8.3"
  - name: postgres
    newName: ${harbor_url}/postgres
    newTag: 16-alpine
  patches:
  - patch: |      
      $patch: delete   
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ml-pipeline-ui-configmap
  - patch: |
      $patch: delete   
      apiVersion: v1
      kind: Secret
      metadata:
        name: mlpipeline-minio-artifact
  - patch: |
      $patch: delete   
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: workflow-controller-configmap
  - patch: |
      $patch: delete 
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: kubeflow-pipelines-profile-controller-code
  - patch: |
      $patch: delete 
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: minio
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: minio-service
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: minio-pvc  
  - patch: |
      - op: replace
        path: /spec/type
        value: LoadBalancer
    target:
      kind: Service
      name: istio-ingressgateway
      namespace: istio-system
  - patch: |
     - op: add
       path: /metadata/namespace
       value: default
    target:
      kind: ConfigMap
      name: default-install-config.*
  - patch: | 
      apiVersion: networking.istio.io/v1beta1
      kind: Gateway
      metadata:
        name: kubeflow-gateway
      spec:
        servers:
        - hosts:
          - '*'
          port:
            name: http
            number: 80
            protocol: HTTP        
        - hosts:
          - '*'
          port:
            name: https
            number: 443
            protocol: HTTPS
          tls:
            credentialName: kubeflow-tls
            mode: SIMPLE
    target:
      kind: Gateway
      name: kubeflow-gateway
      namespace: kubeflow
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ml-pipeline-ui
      spec:
        template:
          spec:
            containers:
              - name: ml-pipeline-ui
                env:
                  - name: AWS_ACCESS_KEY_ID
                    valueFrom:
                      secretKeyRef:
                        name: mlpipeline-minio-artifact
                        key: accesskey
                  - name: AWS_SECRET_ACCESS_KEY
                    valueFrom:
                      secretKeyRef:
                        name: mlpipeline-minio-artifact
                        key: secretkey
                  - name: AWS_S3_ENDPOINT
                    valueFrom:
                      configMapKeyRef:
                        name: pipeline-install-config
                        key: objStoreHost
                  - name: AWS_REGION
                    valueFrom:
                      configMapKeyRef:
                        name: pipeline-install-config
                        key: objStoreRegion  
    target:
      kind: Deployment
      name: ml-pipeline-ui
      namespace: kubeflow
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ml-pipeline
      spec:
        template:
          spec:
            containers:
              - env:
                  - name: OBJECTSTORECONFIG_HOST
                    valueFrom:
                      configMapKeyRef:
                        name: pipeline-install-config
                        key: objStoreHost
                  - name: OBJECTSTORECONFIG_BUCKETNAME
                    valueFrom:
                      configMapKeyRef:
                        name: pipeline-install-config
                        key: bucketName
                  - name: OBJECTSTORECONFIG_REGION
                    valueFrom:
                      configMapKeyRef:
                        name: pipeline-install-config
                        key: objStoreRegion
                  - name: OBJECTSTORECONFIG_PORT
                    value: ""
                name: ml-pipeline-api-server
    target:
      kind: Deployment
      name: ml-pipeline
      namespace: kubeflow
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: metadata-writer
      spec:
        template:
          metadata:
            labels:
              app: metadata-writer
          spec:
            containers:
            - name: main
              env:
              - name: OBJECT_STORE_ENDPOINT
                valueFrom:
                  configMapKeyRef:
                    name: pipeline-install-config
                    key: objStoreHost
              - name: OBJECT_STORE_BUCKET
                valueFrom:
                  configMapKeyRef:
                    name: pipeline-install-config
                    key: bucketName
              - name: S3_COMPATIBLE_OBJECT_STORE
                value: "true"  
    target:
      kind: Deployment
      name: metadata-writer
      namespace: kubeflow
  - patch: |      
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kubeflow-pipelines-profile-controller
        namespace: kubeflow
      spec:
        template:
          spec:
            containers:
            - name: profile-controller
              env:
              - name: MINIO_SERVICE_REGION
                valueFrom:
                  configMapKeyRef:
                    name: pipeline-install-config
                    key: objStoreRegion
              - name: MINIO_SERVICE_HOST
                valueFrom:
                  configMapKeyRef:
                    name: pipeline-install-config
                    key: objStoreHost
              - name: FRONTEND_TAG
                value: 2.0.3
              - name: FRONTEND_IMAGE
                value: ${harbor_url}/kfp-frontend
    target:
      kind: Deployment
      name: kubeflow-pipelines-profile-controller
      namespace: kubeflow
  - patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: pipeline-install-config
      data:
        bucketName: mlpipeline
        insecure: "true"
        objStoreHost: 10.122.7.101
        objStoreRegion: us-east-1
    target: 
      kind: ConfigMap
      name: pipeline-install-config       
  interval: 6h
  timeout: 15m0s
  path: ./manifests/example
  prune: false
  sourceRef:
   kind: GitRepository
   name: kubeflow-instance
   namespace: ${releaseNamespace}
---




